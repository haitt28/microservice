spring:
  application:
    name: product-service
  
  # Database Configuration
  datasource:
    url: jdbc:postgresql://localhost:5432/product_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  
  # JPA/Hibernate
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate  # Flyway quản lý schema
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
  
  # Flyway Migration
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true
  
  # Kafka Configuration
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: product-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
    topics:
      product-created: product.created
      product-updated: product.updated
      product-deleted: product.deleted
      product-price-changed: product.price.changed
      inventory-updated: inventory.updated
      order-completed: order.completed
  
  # Redis Configuration
  data:
    redis:
      host: localhost
      port: 6379
      password:
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
    
    # ElasticSearch Configuration
    elasticsearch:
      uris: http://localhost:9200
      username:
      password:
      connection-timeout: 5s
      socket-timeout: 30s
  
  # Security - OAuth2 Resource Server
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/fiinx
          jwk-set-uri: http://localhost:8080/realms/fiinx/protocol/openid-connect/certs
  
  # Cache
  cache:
    type: redis
    redis:
      time-to-live: 3600000  # 1 hour

# Server Configuration
server:
  port: 8083
  servlet:
    context-path: /
  compression:
    enabled: true
  http2:
    enabled: true

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}

# Logging
logging:
  level:
    root: INFO
    com.fiinx.product: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Resilience4j
resilience4j:
  circuitbreaker:
    instances:
      elasticsearch:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10000
        permitted-number-of-calls-in-half-open-state: 3
  retry:
    instances:
      elasticsearch:
        max-attempts: 3
        wait-duration: 1000

# Redisson Configuration
redisson:
  single-server-config:
    address: redis://localhost:6379
    connection-pool-size: 10
    connection-minimum-idle-size: 5

# OpenAPI Documentation
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  show-actuator: true

# Application Specific
application:
  cache:
    product-detail-ttl: 3600  # 1 hour
    product-list-ttl: 900     # 15 minutes
    category-tree-ttl: 86400  # 24 hours
  search:
    elasticsearch-enabled: true
    max-results: 1000
  pagination:
    default-page-size: 20
    max-page-size: 100
