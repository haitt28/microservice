spring:
  application:
    name: shipping-service
  
  datasource:
    url: jdbc:postgresql://localhost:5432/shipping_db
    username: postgres
    password: postgres
  
  jpa:
    hibernate:
      ddl-auto: validate
  
  flyway:
    enabled: true
  
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/fiinx

server:
  port: 8087

logging:
  level:
    com.fiinx.shipping: DEBUG

# Provider Mock URLs
shipping:
  providers:
    ghn:
      api-url: https://dev-online-gateway.ghn.vn/shiip/public-api/v2
      api-token: mock-token
    ghtk:
      api-url: https://services.giaohandientu.vn/services/shipment/v2
      api-token: mock-token
