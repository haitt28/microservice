server:
  port: 8082
spring:
  application:
    name: inventory-service
  datasource:
    # Senior Note: Sử dụng 127.0.0.1 thay vì localhost để tránh lỗi phân giải địa chỉ trên Windows
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:5432/inventorydb
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate # Senior Note: Use 'validate' in production to prevent unexpected schema changes
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  cloud:
    config:
      enabled: false
