server:
  port: 8085

spring:
  application:
    name: identity-service
  
  # Database Configuration
  datasource:
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:5432/identitydb
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  
  # JPA/Hibernate
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

  keycloak:
    realm: ${KEYCLOAK_REALM:microservice-realm}
    auth-server-url: ${KEYCLOAK_AUTH_SERVER_URL:http://localhost:8080}
    client-id: ${KEYCLOAK_CLIENT_ID:fiinx-client}
    
  # Security - OAuth2 Resource Server
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/microservice-realm
          jwk-set-uri: http://localhost:8080/realms/microservice-realm/protocol/openid-connect/certs

keycloak:
  auth-server-url: ${KEYCLOAK_AUTH_SERVER_URL:http://localhost:8080}
  realm: ${KEYCLOAK_REALM:microservice-realm}
  client-id: ${KEYCLOAK_CLIENT_ID:fiinx-client}
  client-secret: ${KEYCLOAK_CLIENT_SECRET:your-client-secret} # Senior Note: Use K8s Secret or Env Var in Production
  admin:
    username: ${KEYCLOAK_ADMIN_USER:admin}
    password: ${KEYCLOAK_ADMIN_PASSWORD:admin}
    client-id: admin-cli

app:
  kafka:
    topics:
      user-created: user-events

# BEST PRACTICE: Observability
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

