spring:
  application:
    name: promotion-service
  
  datasource:
    url: jdbc:postgresql://localhost:5432/promotion_db
    username: postgres
    password: postgres
  
  jpa:
    hibernate:
      ddl-auto: validate
  
  flyway:
    enabled: true
  
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/fiinx

server:
  port: 8085

logging:
  level:
    com.fiinx.promotion: DEBUG
