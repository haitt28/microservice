name: Identity Service CI/CD

on:
  push:
    branches: [ main ]
    paths:
      - 'identity-service/**'
      - 'common-lib/**'
      - '.github/workflows/identity-service.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'identity-service/**'
      - 'common-lib/**'

jobs:
  build-and-test:
    # Senior Choice: Sử dụng self-hosted nếu bạn đã cài runner trên VM, 
    # hoặc ubuntu-latest nếu muốn dùng tài nguyên của GitHub (cần mạng mạnh)
    runs-on: self-hosted
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: |
          chmod +x mvnw
          ./mvnw clean package -pl identity-service -am -DskipTests -B

  docker-build-push:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: identity-service/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/identity-service:latest

  deploy:
    needs: docker-build-push
    runs-on: self-hosted
    
    steps:
      - name: Deploy to Environment
        run: |
          # Di chuyển tới thư mục chứa docker-compose trên VM của bạn
          # Giả sử thư mục code local của bạn đã được map hoặc runner nằm cùng server deploy
          docker-compose pull identity-service
          docker-compose up -d identity-service
          docker system prune -f
